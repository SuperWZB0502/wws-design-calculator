<!doctype html>

ground:#eef3f7}.nav-footer{font-size:11px;color:#acc1d1;padding:16px 23px;border-top:1px solid #ffffff20}.workspace{margin-left:252px;min-height:100vh}.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 38px;background:#fff;border-bottom:1px solid var(--line)}.breadcrumb{color:var(--muted);font-size:13px}.breadcrumb strong{color:var(--ink);font-weight:500}.tools{display:flex;align-items:center;gap:8px}.save-state{font-size:12px;color:#5a7983;margin-right:12px}.save-state:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#3e8c76;margin-right:7px}.main{max-width:1400px;padding:31px 38px 50px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:23px}.heading h2{font-size:29px;line-height:1.4;margin:0 0 7px;letter-spacing:.4px}.heading p{margin:0;color:var(--muted)}.legend{display:flex;gap:17px;white-space:nowrap;font-size:12px;color:var(--muted);padding-bottom:5px}.legend span:before{content:"";display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:6px;background:var(--orange);border:1px solid var(--orange-border)}.legend span:last-child:before{background:var(--yellow);border-color:#e7d77c}.subnav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}.subnav button{background:transparent;font-size:13px;padding:6px 12px;border-color:transparent}.subnav button.active{background:#e6eef5;color:var(--blue);border-color:#c8d9e7;font-weight:600}.panel{background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:22px;overflow:hidden}.panel-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 23px;border-bottom:1px solid var(--line)}.panel-header h3{margin:0;font-size:16px;font-weight:650}.panel-header h3:before{content:"";display:inline-block;width:3px;height:15px;background:#e3a153;vertical-align:-2px;margin-right:10px}.panel-header.results h3:before{background:#d7be45}.panel-hint{font-size:12px;color:var(--muted)}.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:21px 24px;padding:23px}.field{min-width:0}.field label{display:flex;justify-content:space-between;gap:6px;align-items:flex-end;font-size:13px;line-height:1.5;min-height:22px;margin-bottom:8px}.unit{color:var(--muted);font-weight:400;font-size:12px}.input-wrap{position:relative}.field input,.field select{width:100%;border:1px solid var(--orange-border);background:var(--orange);border-radius:5px;height:42px;padding:8px 12px;color:#6c4013;min-width:0}.field input[type=number]{font-variant-numeric:tabular-nums}.field input:focus,.field select:focus{border-color:#ba762b}.field small{display:block;font-size:11px;color:var(--muted);margin-top:4px;min-height:0}.field.invalid input,.field.invalid select{border:1px solid #ca5752}.field.invalid small{color:#bc3e38}.field-secondary{padding:0 23px 22px}.field-secondary summary{cursor:pointer;color:var(--blue);font-size:13px;padding:8px 0}.field-secondary .fields{padding:16px 0 0}.input-foot{border-top:1px solid var(--line);background:#fafcfd;padding:13px 23px;display:flex;gap:13px;align-items:center;justify-content:space-between}.input-foot p{margin:0;color:var(--muted);font-size:12px}.input-foot button{font-size:13px;padding:6px 12px}.result-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;padding:22px}.result{background:var(--yellow);border:1px solid #ecdfa2;border-radius:6px;padding:17px 18px;min-width:0}.result-label{font-size:13px;margin-bottom:9px;color:#6c6036;line-height:1.5}.result-value{font-size:27px;line-height:1.3;letter-spacing:.2px;font-weight:650;font-variant-numeric:tabular-nums;color:#534318;overflow-wrap:anywhere}.result-value.text{font-size:19px}.result .unit{display:block;font-size:12px;margin-top:6px;color:#8c7e4f}.result .source{font-size:10px;margin-top:8px;color:#9e9267}.result.pending .result-value{font-size:17px;color:#977b47}.status-tag{font-size:12px;background:#edf6f1;color:#44745d;border-radius:4px;padding:4px 9px}.status-tag.warn{background:#fff0df;color:#ad6c21}.notice{border-left:3px solid #dba44f;padding:11px 14px;background:#fff9e9;color:#7e6238;line-height:1.8;font-size:12px;margin:0 0 20px;border-radius:0 5px 5px 0}.checks{padding:0 23px 18px}.check{margin:7px 0;font-size:13px;color:#aa652a}.details{padding:0}.details summary{padding:16px 23px;cursor:pointer;font-weight:550}.details-content{padding:0 23px 22px}.table-scroll{overflow:auto;max-height:480px;border:1px solid var(--line);border-radius:4px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}th{background:#f0f5f9;color:var(--muted);font-weight:500;position:sticky;top:0;z-index:1}td code{font-family:Consolas,monospace;color:#677b8d;font-size:11px;white-space:normal;overflow-wrap:anywhere}.detail-value{font-variant-numeric:tabular-nums;white-space:nowrap}.raw-grid{width:max-content;min-width:100%}.raw-grid td{min-width:83px;max-width:230px;white-space:normal}.raw-grid td.raw-input{background:var(--orange)}.raw-grid td.raw-result{background:var(--yellow)}.raw-grid .rownum{min-width:36px;background:#f4f7fa;color:var(--muted)}.raw-help{color:var(--muted);font-size:12px;margin-bottom:10px}.mobile-module{display:none}footer{display:flex;justify-content:space-between;color:#8494a2;font-size:11px;margin-top:25px;gap:12px}.toast{position:fixed;bottom:28px;left:calc(50% + 126px);transform:translateX(-50%);background:#243e51;color:#fff;padding:11px 20px;border-radius:6px;box-shadow:0 4px 20px #0002;z-index:10;max-width:80vw;display:none}.mobile-tools{display:none}.file-input{display:none}
@media(min-width:1550px){.fields{grid-template-columns:repeat(4,minmax(0,1fr));gap:23px 30px}.main{padding-top:37px}.heading{margin-bottom:29px}}
@media(max-width:1150px){aside{width:224px}.workspace{margin-left:224px}.topbar{padding:0 25px}.main{padding:25px}.brand h1{font-size:18px}.fields{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.save-state{display:none}.result-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toast{left:calc(50% + 112px)}}
@media(max-width:800px){aside{position:static;width:100%;height:auto}.brand{padding:15px 20px;display:flex;gap:12px;align-items:center;border-bottom:0}.brandmark{margin:0;width:30px;height:30px;font-size:20px}.brand h1{font-size:18px}.brand p,nav,.nav-head,.nav-footer{display:none}.workspace{margin-left:0}.topbar{height:auto;min-height:55px;padding:10px 18px}.breadcrumb{display:none}.tools{width:100%;justify-content:flex-end}.tools button{font-size:12px;padding:6px 9px}.main{padding:23px 17px}.heading{align-items:flex-start}.heading h2{font-size:25px}.heading p{font-size:12px}.legend{flex-direction:column;gap:3px}.mobile-module{display:block;margin-bottom:20px}.mobile-module select{width:100%;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:5px;color:var(--ink)}.fields{grid-template-columns:repeat(2,minmax(0,1fr));padding:19px;gap:18px 15px}.panel-header{padding:15px 19px}.panel-hint{display:none}.result-grid{padding:17px;gap:11px}.result{padding:14px}.result-value{font-size:24px}.result-label{font-size:12px}.input-foot{padding:12px 19px;align-items:flex-start}.input-foot p{max-width:65%}.details summary{padding:15px 19px}.details-content{padding:0 17px 17px}.toast{left:50%}.subnav{gap:4px}.subnav button{padding:5px 9px}.field-secondary{padding:0 19px 19px}footer{flex-direction:column;gap:3px}}
@media(max-width:420px){.fields{grid-template-columns:1fr 1fr;gap:17px 12px}.field label{font-size:12px}.result-grid{grid-template-columns:1fr}.heading h2{font-size:23px}.legend{font-size:11px}.tools button{font-size:11px;padding:6px 8px}.brand h1{font-size:17px}}
/* Result fields share the input grid and 42px control height. */
.brand{display:flex;align-items:center;justify-content:center;padding:20px 18px;background:transparent}
.brand-signature{display:block;width:100%;height:auto;max-width:216px;object-fit:contain}
.result-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:21px 24px;padding:23px}
.result{background:none;border:0;border-radius:0;padding:0;min-width:0}
.result-label{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;min-height:22px;margin:0 0 8px;font-size:13px;line-height:1.5;color:var(--ink)}
.result .unit{display:inline;margin:0;font-size:12px;line-height:1.5;color:var(--muted);flex-shrink:0}
.result-value,.result-value.text,.result.pending .result-value{height:42px;border:1px solid #ecdfa2;background:var(--yellow);border-radius:5px;padding:8px 12px;font-size:14px;line-height:24px;letter-spacing:normal;font-weight:500;overflow-wrap:anywhere;overflow:hidden}
.result.pending .result-value{padding:4px 10px;font-size:12px;line-height:16px}
@media(min-width:1550px){.result-grid{gap:23px 30px}}
@media(max-width:1150px){.result-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
@media(max-width:800px){.brand{padding:7px 20px;justify-content:flex-start}.brand-signature{width:150px;max-width:100%}.result-grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:19px;gap:18px 15px}}
@media(max-width:420px){.result-grid{gap:17px 12px}.result-label{font-size:12px}}
[hidden]{display:none!important}
@media print{aside,.topbar,.mobile-module,.subnav,.input-foot,.details,.toast{display:none!important}.workspace{margin:0}.main{padding:0;max-width:none}.panel,.result{break-inside:avoid}.fields{grid-template-columns:repeat(3,1fr)}.result-grid{grid-template-columns:repeat(3,1fr)}body{background:#fff}.heading:before{content:'万唯嗣设计计算系统';font-size:16px;display:block}.heading{display:block}.legend{display:none}.field input,.field select{appearance:none;color:#000}.panel{border-color:#bbb}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

function cell(s,a){return engine.sheets.get(s)?.get(a);}
function label(group,a){const m=group.meta[a]||{};let v=m.labelRef?engine.get(group.sheet,m.labelRef):null;return typeof v==='string'&&v&&!/^\*+$/.test(v)&&!v.startsWith('=')?v:m.label||a;}
function options(s,a){const sh=sheetMap.get(s);const row=cell(s,a)?.r,col=cell(s,a)?.c;for(const dv of sh.validations){if(dv.type!=='list')continue;const match=dv.range.split(' ').some(ref=>{if(ref===a)return true;if(!ref.includes(':'))return false;const [x,y]=ref.split(':').map(v=>v.match(/([A-Z]+)(\d+)/));const cn=t=>[...t].reduce((n,c)=>n*26+c.charCodeAt()-64,0);return x&&y&&row>=+x[2]&&row<=+y[2]&&col>=cn(x[1])&&col<=cn(y[1]);});if(!match)continue;const f=dv.formula||'';const values=f.startsWith('"')?f.slice(1,-1).split(',').map(v=>v.trim()!==''&&Number.isFinite(Number(v))?Number(v):v):engine.ref(s,f.replace(/^=/,'').replace(/\$/g,''));return (Array.isArray(values)?values.flat(Infinity):[]).filter(v=>v!==null&&v!==''&&!v?.error).filter((v,i,ar)=>ar.findIndex(x=>String(x)===String(v))===i);}return [];}
function unit(group,a){let u=group.meta[a]?.unit||'';if(group.sheet==='收尘器'){
 if(['B9','C9','B18','C18'].includes(a))u='kg';
 if(['B10','B11'].includes(a))u='m²';
 if(['B12','C12'].includes(a))u='m³/min';
 if(['B15','C15','B19','C19'].includes(a))u='kW';
 if(a==='B17')u='m³/h';
 if(a==='I15')u='m/s（原表标注 m）';}
 if(group.sheet==='平底库卸空率'&&a==='B8')u='t/m³（原表标注 m³/t）';
 return u.replace(/m3/g,'m³').replace(/m2/g,'m²');}
function valueText(v,fmt){if(v?.error)return v.error;if(v==null||v==='')return '—';if(typeof v==='boolean')return v?'是':'否';if(typeof v==='string')return /^\*+$/.test(v)?'—':v;if(fmt&&fmt.includes('%'))return (v*100).toLocaleString('zh-CN',{maximumFractionDigits:3})+'%';return v.toLocaleString('zh-CN',{maximumFractionDigits:8});}
function fieldHTML(group,a){const c=cell(group.sheet,a),v=engine.get(group.sheet,a),opts=options(group.sheet,a),name=label(group,a),u=unit(group,a);const numeric=typeof c?.v==='number'||c?.v==null&&!(group.sheet==='空压机站'&&c?.r===1);const id='input-'+a;
 const optHTML=opts.map(o=>`<option value="${esc(o)}" ${String(o)===String(v)?'selected':''}>${esc(o)}</option>`).join('');
 const missing=opts.length&&!opts.some(o=>String(o)===String(v));
 const input=opts.length?`<select id="${id}" data-ref="${a}" data-numeric="${typeof opts[0]==='number'}" data-options="${esc(JSON.stringify(opts))}">${missing?`<option value="${esc(v)}">${esc(v??'请选择')}（请重新选择）</option>`:''}${optHTML}</select>`:`<input id="${id}" data-ref="${a}" data-numeric="${numeric}" type="${numeric?'number':'text'}" ${numeric?'step="any" inputmode="decimal"':''} value="${esc(v??'')}" placeholder="${group.sheet==='振动筛'&&a==='B4'?'可留空':c?.v==null?'待填写':'请输入'}" autocomplete="off">`;
 return `<div class="field" data-field="${a}"><label for="${id}"><span data-label="${a}">${esc(name)}</span>${u?`<span class="unit">${esc(u)}</span>`:''}</label><div class="input-wrap">${input}</div><small id="error-${a}"></small></div>`;
}
function render(){const group=g(),s=group.sheet;validation.clear();document.title=moduleTitles[s]||s;document.title+=' · 万唯嗣设计计算系统';
 $('nav').innerHTML=modules.map(x=>`<button class="nav-item ${s===x?'active':''}" data-module="${esc(x)}" ${s===x?'aria-current="page"':''}><span class="nav-symbol" aria-hidden="true">${esc((moduleTitles[x]||x)[0])}</span><span>${esc(moduleTitles[x]||x)}</span></button>`).join('');
 $('mobileNav').innerHTML=modules.map(x=>`<option value="${esc(x)}" ${x===s?'selected':''}>${esc(moduleTitles[x]||x)}</option>`).join('');
 $('title').textContent=moduleTitles[s]||s;$('crumb').textContent=moduleTitles[s]||s;$('subtitle').textContent=descriptions[s];
 const siblings=DATA.groups.map((x,i)=>({...x,index:i})).filter(x=>x.sheet===s);$('subnav').hidden=siblings.length<2;$('subnav').innerHTML=siblings.map(x=>`<button data-group="${x.index}" class="${x.index===active?'active':''}" ${x.index===active?'aria-current="true"':''}>${esc(x.title)}</button>`).join('');
 $('formTitle').textContent=siblings.length===1?'基本参数':group.title+' · 参数';$('notice').innerHTML=group.note?`<div class="notice">${esc(group.note)}</div>`:'';
 let base=group.fields,extra=[];
 if(s==='皮带机'){base=group.fields.filter(a=>a[0]==='B');extra=group.fields.filter(a=>a[0]!=='B');}
 else if(s==='平底库卸空率'){base=group.fields.filter(a=>a[0]==='B');extra=group.fields.filter(a=>a[0]==='H');}
 else if(s==='露天台阶爆破'){base=group.fields.filter(a=>a[0]==='B');extra=group.fields.filter(a=>a[0]!=='B');}
 $('fields').innerHTML=base.map(a=>fieldHTML(group,a)).join('');$('advancedFields').innerHTML=extra.map(a=>fieldHTML(group,a)).join('');$('moreFields').hidden=!extra.length;$('moreFields').open=false;$('moreTitle').textContent=s==='平底库卸空率'?'填写各层死料区面积（原表人工输入）':s==='露天台阶爆破'?'装药分配与目标参数':'更多计算与选型参数';
 $('process').open=false;$('source').open=false;$('processContent').innerHTML='';$('rawContent').innerHTML='';
 document.querySelectorAll('[data-ref]').forEach(el=>{el.setAttribute('aria-describedby','error-'+el.dataset.ref);el.addEventListener(el.tagName==='SELECT'?'change':'input',onInput);});
 refresh();persist();
}
function onInput(event){const el=event.target;let v=el.value;if(el.dataset.numeric==='true')v=v===''?null:Number(v);engine.set(g().sheet,el.dataset.ref,v);persist();refresh();}
function optional(group,a){const c=cell(group.sheet,a);return group.sheet==='振动筛'&&a==='B4'||group.sheet==='空压机站'&&c?.fill==='theme:5'&&![8,9,14,19].includes(c.r)||group.sheet==='平底库卸空率'&&a[0]==='H'||a==='U3';}
function validate(group){validation.clear();for(const a of group.fields){const el=$('input-'+a),v=engine.get(group.sheet,a),name=label(group,a),u=unit(group,a);let msg='';
 if(el?.validity.badInput)msg='请输入有效数字';
 else if((v===null||v==='')&&!optional(group,a))msg='请填写此参数';
 else if(typeof v==='number'&&!Number.isFinite(v))msg='请输入有效数字';
 else if(typeof v==='number'&&v<0)msg='请输入不小于 0 的数值';
 else if(typeof v==='number'&&(u==='%'||u.includes('比例'))&&(v>(u==='%'?100:1)))msg=u==='%'?'请输入 0～100':'请输入 0～1';
 else if(typeof v==='number'&&/效率/.test(name)&&u!=='%'&&(v<=0||v>1))msg='效率需大于 0 且不超过 1';
 else if(typeof v==='number'&&(/台数|个数|排数|孔数|层数|清扫器个数/.test(name)||group.sheet==='收尘器'&&a==='B4')&&!Number.isInteger(v))msg='请输入整数';
 const opts=options(group.sheet,a);if(!msg&&opts.length&&!opts.some(o=>String(o)===String(v)))msg='请从当前可用选项重新选择';
 if(msg)validation.set(a,msg);if(el){el.closest('.field').classList.toggle('invalid',!!msg);el.setAttribute('aria-invalid',String(!!msg));$('error-'+a).textContent=msg;}}
 return validation.size===0;
}
function pending(group,a){if(validation.size)return '请完善输入参数';
 if(group.sheet==='平底库卸空率'&&a!=='B12'){for(let r=4;r<=36;r++){const v=engine.get(group.sheet,'H'+r);if(v===null||v==='')return '待补充死料区面积';if(Number(v)===0)return null;}return '待确认死料区结束层';}
 if(group.sheet==='露天台阶爆破'&&engine.get(group.sheet,'B7')==='改性铵油炸药'&&['I29','I31','K31'].includes(a)&&!engine.get(group.sheet,'U3'))return '待填写 TNT 当量';return null;}
function refresh(){const group=g();
 document.querySelectorAll('[data-label]').forEach(el=>{el.textContent=label(group,el.dataset.label);});
 document.querySelectorAll('select[data-ref]').forEach(el=>{const opts=options(group.sheet,el.dataset.ref),key=JSON.stringify(opts);if(el.dataset.options!==key){const v=engine.get(group.sheet,el.dataset.ref);el.innerHTML=(!opts.some(o=>String(o)===String(v))?`<option value="${esc(v)}">${esc(v??'请选择')}（请重新选择）</option>`:'')+opts.map(o=>`<option value="${esc(o)}" ${String(o)===String(v)?'selected':''}>${esc(o)}</option>`).join('');el.dataset.options=key;}});
 validate(group);let hasPending=false,hasError=false;
 $('results').innerHTML=group.outputs.map(a=>{const c=cell(group.sheet,a),v=engine.get(group.sheet,a),p=pending(group,a),e=v?.error;if(p)hasPending=true;if(e)hasError=true;const text=p||(e?(e==='#N/A'?'无匹配选型，请调整参数':e==='#DIV/0!'?'分母为 0，请检查参数':'计算异常，请检查参数'):valueText(v,c?.fmt));return `<div class="result ${p||e?'pending':''}"><div class="result-label"><span>${esc(label(group,a))}</span>${unit(group,a)?`<span class="unit">${esc(unit(group,a))}</span>`:''}</div><div class="result-value ${typeof v!=='number'?'text':''}" title="${esc(text)}（${esc(a)}）">${esc(text)}</div></div>`;}).join('');
 $('calcStatus').textContent=hasPending?'待完善参数':hasError?'请检查参数':'已按当前参数计算';$('calcStatus').classList.toggle('warn',hasPending||hasError);
 const checks=sheetMap.get(group.sheet).cells.filter(c=>c.c===4&&c.f&&c.r<=40).map(c=>engine.get(group.sheet,c.a)).filter(v=>typeof v==='string'&&v&&!/^\*+$/.test(v));
 $('checks').innerHTML=checks.map(v=>`<div class="check">${esc(v)}</div>`).join('');
 $('inputHint').textContent=validation.size?'有 '+validation.size+' 项参数需要检查。':'参数修改后，下面的计算结果会同步更新。';
 if($('process').open)renderProcess();if($('source').open)renderSource();
}
function renderProcess(){const group=g();const refs=[...new Set([...group.outputs,...group.details])].filter(a=>cell(group.sheet,a)?.f);$('processContent').innerHTML=`<div class="table-scroll"><table><thead><tr><th>参数 / 结果</th><th>当前值</th><th>单元格</th><th>源表公式</th></tr></thead><tbody>${refs.map(a=>`<tr><td>${esc(label(group,a))}</td><td class="detail-value">${esc(pending(group,a)||valueText(engine.get(group.sheet,a),cell(group.sheet,a)?.fmt))}</td><td>${a}</td><td><code>${esc(cell(group.sheet,a).f)}</code></td></tr>`).join('')}</tbody></table></div>`;}
function renderSource(){const group=g(),sh=sheetMap.get(group.sheet);const cells=sh.cells;const lastRow=Math.max(...cells.filter(c=>c.v!==null||c.f).map(c=>c.r));let html='<table class="raw-grid"><thead><tr><th></th>';for(let c=1;c<=sh.cols;c++){let n=c,x='';while(n){n--;x=String.fromCharCode(65+n%26)+x;n=Math.floor(n/26);}html+='<th>'+x+'</th>';}html+='</tr></thead><tbody>';for(let r=1;r<=lastRow;r++){const row=cells.filter(c=>c.r===r);if(!row.some(c=>c.v!==null||c.f))continue;html+='<tr><td class="rownum">'+r+'</td>';for(let n=1;n<=sh.cols;n++){const c=row.find(x=>x.c===n);const manual=sh.name==='平底库卸空率'&&[2,3,4].includes(n)&&r>=13&&r<=15;html+=`<td class="${c?.f?'raw-result':c?.fill==='theme:5'?'raw-input':''}" title="${esc(c?.a+(c?.f?' '+c.f:''))}">${esc(c?(manual&&pending(group,c.a)?'待补充面积':valueText(engine.get(sh.name,c.a),c.fmt)):'')}</td>`;}html+='</tr>';}html+='</tbody></table>';$('rawContent').innerHTML=html;}
function switchModule(s){active=DATA.groups.findIndex(x=>x.sheet===s);render();window.scrollTo({top:0,behavior:'instant'});}
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-module]');if(b)switchModule(b.dataset.module);});
$('mobileNav').addEventListener('change',e=>switchModule(e.target.value));
$('subnav').addEventListener('click',e=>{const b=e.target.closest('[data-group]');if(b){active=+b.dataset.group;render();}});
$('reset').addEventListener('click',()=>{for(const a of g().fields)delete engine.values[g().sheet+'!'+a];engine.cache.clear();render();toast('已恢复本项目默认参数');});
$('process').addEventListener('toggle',()=>{if($('process').open)renderProcess();});
$('source').addEventListener('toggle',()=>{if($('source').open)renderSource();});
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function csvValue(v){return '"'+String(v??'').replace(/"/g,'""')+'"';}
$('export').addEventListener('click',()=>{const group=g();let rows=[['万唯嗣设计计算系统',group.sheet,group.title],['类型','项目','值','单位','源表单元格']];for(const [type,refs] of [['输入',group.fields],['输出',group.outputs]])for(const a of refs){let v=type==='输出'?pending(group,a):null;v=v||valueText(engine.get(group.sheet,a),cell(group.sheet,a)?.fmt);rows.push([type,label(group,a),v,unit(group,a),a]);}download(group.title+'-计算结果.csv','\uFEFF'+rows.map(r=>r.map(csvValue).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('已导出当前项目的参数与结果');});
$('saveParams').addEventListener('click',()=>{download('万唯嗣设计计算系统-参数.json',JSON.stringify({system:'万唯嗣设计计算系统',version:1,active,values:engine.values},null,2),'application/json');toast('参数文件已保存');});
$('loadParams').addEventListener('click',()=>$('fileInput').click());
$('fileInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.system!=='万唯嗣设计计算系统'||d.version!==1||!d.values||typeof d.values!=='object'||Array.isArray(d.values))throw Error();engine.values=acceptValues(d.values);engine.cache.clear();if(Number.isInteger(d.active)&&DATA.groups[d.active])active=d.active;render();toast('已载入参数并重新计算');}catch{toast('无法载入，请选择本系统保存的参数 JSON 文件');}e.target.value='';});
$('print').addEventListener('click',()=>window.print());
render();
// Read-only hooks make independent formula checks possible without changing UI state.
window.wwsCalculator={engine,data:DATA,current:()=>g()};
</script></body></html>
